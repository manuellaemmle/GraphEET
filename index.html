<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GraphEET – Graphen und KI-Verfahren für das Technische Monitoring</title>
  <meta name="description" content="GraphEET: Graphen und KI-Verfahren für das Technische Monitoring von energieeffizienten Gebäuden. Verbundforschungsprojekt, gefördert durch das BMWE, 07/2025–06/2028.">
  <link rel="stylesheet" href="assets/css/site.css">
</head>
<body>
  <main class="sheet">
    <header class="hero">
      <div>
        <h1 data-p="title"></h1>
        <p class="subtitle" data-p="subtitle"></p>
        <p class="problem" data-p="heroProblem"></p>
        <p class="approach" data-p="heroApproach"></p>
      </div>

      <figure class="morph">
        <!-- Hand-made. Four point names of the LBNL SDAHU data set: first a table, then nodes of a graph. -->
        <svg viewBox="0 0 440 320" role="img" aria-labelledby="morph-title">
          <title id="morph-title" data-t="hero.svgTitle"></title>
          <line class="edge" x1="90" y1="60" x2="220" y2="160"/>
          <line class="edge" x1="350" y1="60" x2="220" y2="160"/>
          <line class="edge" x1="90" y1="260" x2="220" y2="160"/>
          <line class="edge" x1="350" y1="260" x2="220" y2="160"/>
          <text class="edge-label" x="220" y="226">brick:isPointOf</text>
          <g class="hub"><circle cx="220" cy="160" r="31"/><text x="220" y="165">AHU</text></g>
          <g class="head"><rect x="150" y="68" width="140" height="30"/><text x="220" y="88" data-t="hero.svgHead"></text></g>
          <g class="box" style="--dx:130px;--dy:53px"><rect x="20" y="45" width="140" height="30"/><text x="90" y="64.5">SA_TEMP</text></g>
          <g class="box" style="--dx:-130px;--dy:83px"><rect x="280" y="45" width="140" height="30"/><text x="350" y="64.5">SA_TEMPSPT</text></g>
          <g class="box" style="--dx:130px;--dy:-87px"><rect x="20" y="245" width="140" height="30"/><text x="90" y="264.5">OA_TEMP</text></g>
          <g class="box" style="--dx:-130px;--dy:-57px"><rect x="280" y="245" width="140" height="30"/><text x="350" y="264.5">RA_TEMP</text></g>
        </svg>
        <figcaption data-t="hero.svgCaption"></figcaption>
      </figure>
    </header>

    <section class="zone" aria-labelledby="about-h">
      <h2 id="about-h" data-t="about.title"></h2>
      <div class="zone-body">
        <div class="split">
          <div class="block">
            <h3 data-t="about.problem"></h3>
            <p data-p="problem"></p>
          </div>
          <figure class="plate" data-img="infrastructure"></figure>
        </div>
        <figure class="plate" data-img="approach"></figure>
        <div class="split">
          <div class="block">
            <h3 data-t="about.approach"></h3>
            <ul data-list="approach"></ul>
          </div>
          <div class="block">
            <h3 data-t="about.goals"></h3>
            <ul data-list="goals"></ul>
          </div>
        </div>
        <div class="block">
          <h3 data-t="about.pilot"></h3>
          <p data-p="pilot"></p>
        </div>
      </div>
    </section>

    <section class="zone" aria-labelledby="partner-h">
      <h2 id="partner-h" data-t="partner.title"></h2>
      <div class="zone-body">
        <ul class="partners" id="partners"></ul>
        <p class="funding" id="funding-line"></p>
      </div>
    </section>

    <footer class="foot">
      <img class="logo" id="funding-logo" width="800" height="663" alt="">
      <dl class="titleblock">
        <div><dt data-t="tb.project"></dt><dd data-p="title"></dd></div>
        <div><dt data-t="tb.duration"></dt><dd data-p="duration"></dd></div>
        <div><dt data-t="tb.fkz"></dt><dd class="ident" data-p="fkz"></dd></div>
        <div>
          <dt data-t="tb.legal"></dt>
          <dd class="legal">
            <!-- TODO: Impressum und Datenschutzerklärung anlegen und hier verlinken (Platzhalter). -->
            <a href="#" data-todo="impressum" data-t="tb.impressum"></a>
            <a href="#" data-todo="datenschutz" data-t="tb.datenschutz"></a>
          </dd>
        </div>
      </dl>
    </footer>
  </main>
  <script type="module" src="assets/js/landing/main.js"></script>
</body>
</html>
